name: 🎉 release (publish)

# Runs when a `chore(release): vX` pull request (label `release`) is merged into
# the default branch. Instead of rebuilding, it reuses the artifacts that
# build.yml already produced for the merge commit (the push-to-main build run),
# waiting for that run to finish if it is still in progress. Then it tags the
# commit and publishes the GitHub Release with changelog-based notes.
on:
  pull_request:
    types: [closed]

permissions:
  contents: read

jobs:
  wait-build:
    name: ⏳ Wait for build
    # Only for merged release PRs.
    if: >-
      github.event.pull_request.merged == true &&
      contains(github.event.pull_request.labels.*.name, 'release')
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      run_id: ${{ steps.find.outputs.run_id }}
    steps:
      - name: ⏳ Wait for build.yml to finish on the release commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.pull_request.merge_commit_sha }}
        run: |
          set -euo pipefail
          echo "Looking for a build.yml run on $SHA"
          # Poll for up to ~60 minutes (180 * 20s).
          for i in $(seq 1 180); do
            read -r run_id status conclusion < <(
              gh api "repos/$GITHUB_REPOSITORY/actions/workflows/build.yml/runs?head_sha=$SHA&event=push" \
                --jq '.workflow_runs[0] // empty | "\(.id) \(.status) \(.conclusion)"'
            ) || true
            if [ -z "${run_id:-}" ]; then
              echo "  ($i) no build run for $SHA yet; waiting…"
              sleep 20; continue
            fi
            echo "  ($i) run $run_id status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              if [ "$conclusion" = "success" ]; then
                echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
                echo "Reusing artifacts from build run $run_id"
                exit 0
              fi
              echo "::error::build run $run_id concluded '$conclusion'; not releasing"
              exit 1
            fi
            sleep 20
          done
          echo "::error::timed out waiting for a build run on $SHA"
          exit 1

  tag:
    name: 🏷️ Tag release
    needs: wait-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.info.outputs.tag }}
    steps:
      - name: 🔑 Mint GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: 🏷️ Read version and create tag
        id: info
        run: |
          set -euo pipefail
          ver=$(grep -oP '<Version>\K[0-9]+\.[0-9]+\.[0-9]+(?=</Version>)' Dtssh.csproj)
          tag="v$ver"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "::error::tag $tag already exists"; exit 1
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "dtssh $tag"
          git push origin "$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  sign-and-attest:
    name: 🔐 Sign and attest release assets
    needs: [wait-build, tag]
    runs-on: windows-2022
    # This environment gates the only job that can mint an OIDC token. Its
    # protection rules must approve the Azure Artifact Signing request.
    environment: release
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    steps:
      - name: ⬇️ Download Windows binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dtssh-win-*
          path: unsigned\windows
          merge-multiple: true
          run-id: ${{ needs.wait-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 🔑 Log in to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: 🔐 Sign Windows binaries with Azure Artifact Signing
        uses: azure/artifact-signing-action@c7ab2a863ab5f9a846ddb8265964877ef296ee82
        with:
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          endpoint: ${{ vars.AZURE_ARTIFACT_SIGNING_ENDPOINT }}
          signing-account-name: ${{ vars.AZURE_ARTIFACT_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ vars.AZURE_ARTIFACT_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\unsigned\windows
          files-folder-filter: "*.exe"
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256
          exclude-environment-credential: true
          exclude-workload-identity-credential: true
          exclude-managed-identity-credential: true
          exclude-shared-token-cache-credential: true
          exclude-visual-studio-credential: true
          exclude-visual-studio-code-credential: true
          exclude-azure-cli-credential: false
          exclude-azure-powershell-credential: true
          exclude-azure-developer-cli-credential: true
          exclude-interactive-browser-credential: true

      - name: ✅ Verify Windows Authenticode signatures
        shell: pwsh
        run: |
          $signatures = Get-ChildItem unsigned\windows -File -Filter *.exe |
           Get-AuthenticodeSignature
          if ($signatures.Count -ne 2 -or ($signatures | Where-Object Status -ne Valid)) {
           $signatures | Format-Table Path, Status, StatusMessage -AutoSize
           throw "Expected valid Authenticode signatures on both Windows binaries."
          }

      - name: ⬇️ Download Linux binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dtssh-linux-*
          path: unsigned\linux
          merge-multiple: true
          run-id: ${{ needs.wait-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: ⬇️ Download macOS binaries
        uses: actions/download-artifact@v8
        with:
          pattern: dtssh-osx-*
          path: unsigned\macos
          merge-multiple: true
          run-id: ${{ needs.wait-build.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: 🗂️ Assemble final release binaries
        shell: pwsh
        run: |
          $expected = @(
           "dtssh-linux-x64",
           "dtssh-linux-arm64",
           "dtssh-osx-arm64",
           "dtssh-win-x64.exe",
           "dtssh-win-arm64.exe"
          )
          $sources = @{
           "dtssh-linux-x64" = "unsigned\linux\dtssh-linux-x64"
           "dtssh-linux-arm64" = "unsigned\linux\dtssh-linux-arm64"
           "dtssh-osx-arm64" = "unsigned\macos\dtssh-osx-arm64"
           "dtssh-win-x64.exe" = "unsigned\windows\dtssh-win-x64.exe"
           "dtssh-win-arm64.exe" = "unsigned\windows\dtssh-win-arm64.exe"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($name in $expected) {
           if (-not (Test-Path -LiteralPath $sources[$name] -PathType Leaf)) {
             throw "Expected release binary '$name' was not produced by the build."
           }
           Copy-Item -LiteralPath $sources[$name] -Destination "dist\$name"
          }
          $expected | Set-Content dist\release-binaries.txt

      - name: 🧰 Install Cosign
        uses: sigstore/cosign-installer@v3.9.1
        with:
          cosign-release: v2.5.2

      - name: 🔏 Create keyless Sigstore signatures
        shell: pwsh
        env:
          COSIGN_EXPERIMENTAL: "1"
        run: |
          $binaries = Get-Content dist\release-binaries.txt
          foreach ($name in $binaries) {
           $file = Join-Path $PWD "dist\$name"
           & cosign sign-blob --yes `
             --output-signature "$file.sig" `
             --output-certificate "$file.pem" `
             --bundle "$file.bundle" `
             $file
           if ($LASTEXITCODE -ne 0) {
             throw "Cosign failed for '$name'."
           }
          }

      - name: 🔐 Generate checksums
        shell: pwsh
        run: |
          $binaries = Get-Content dist\release-binaries.txt
          $checksums = foreach ($name in $binaries) {
           $hash = (Get-FileHash -Algorithm SHA256 "dist\$name").Hash.ToLowerInvariant()
           "$hash  $name"
          }
          $checksums | Set-Content dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: 📜 Attest final release binaries
        uses: actions/attest-build-provenance@v3
        with:
          subject-checksums: dist\SHA256SUMS.txt

      - name: ⬆️ Upload signed release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: |
           dist/dtssh-*
           dist/SHA256SUMS.txt
          if-no-files-found: error

  release:
    name: 🎉 Publish GitHub release
    needs: [wait-build, tag, sign-and-attest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.tag.outputs.tag }}
          fetch-depth: 0

      - name: 🧰 Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: 📝 Generate release notes
        run: |
          set -euo pipefail
          git cliff --config .config/cliff.toml --latest --strip all -o RELEASE_NOTES.md
          echo "----- RELEASE_NOTES.md -----"
          cat RELEASE_NOTES.md

      - name: ⬇️ Download signed release assets
        uses: actions/download-artifact@v8
        with:
          name: release-assets
          path: dist

      - name: 🎉 Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.tag }}
        run: |
          set -euo pipefail
          gh release create "$TAG" \
            dist/dtssh-* dist/SHA256SUMS.txt \
            --title "dtssh $TAG" \
            --notes-file RELEASE_NOTES.md \
            ${{ contains(github.event.pull_request.labels.*.name, 'prerelease') && '--prerelease' || '' }}
